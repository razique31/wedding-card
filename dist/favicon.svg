<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Emerald background with rounded corners for browser tabs -->
  <rect width="32" height="32" rx="6" fill="#1B4332" />

  <!-- Outer Geometric Octagonal Frame in Gold -->
  <polygon
    points="11,4 21,4 28,11 28,21 21,28 11,28 4,21 4,11"
    fill="none"
    stroke="#C9A96E"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Subtle Islamic 8-Pointed Star Motif (Rub el Hizb) -->
  <g stroke="#C9A96E" stroke-width="1.2" stroke-linejoin="round" fill="#C9A96E" fill-opacity="0.12">
    <rect x="11" y="11" width="10" height="10" />
    <rect x="11" y="11" width="10" height="10" transform="rotate(45 16 16)" />
  </g>

  <!-- Central focal point (Nukta) -->
  <circle cx="16" cy="16" r="1.3" fill="#C9A96E" />
</svg>
